<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myth vs. Med</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Myth vs. Med 🩺</h1>
            <p>Can you separate the old wives' tales from actual medical science?</p>
            <div id="progress">Question 1 of 5</div>
        </header>

        <!-- 3D Flip Card Container -->
        <div class="card-container" id="card-container">
            <div class="card-inner" id="card-inner">
                
                <!-- Front of Card: The Myth -->
                <div class="card-front">
                    <span class="badge">Myth or Fact?</span>
                    <h2 id="myth-text">Loading myth...</h2>
                    <div class="button-group">
                        <button class="btn btn-true" onclick="checkAnswer(true)">True</button>
                        <button class="btn btn-false" onclick="checkAnswer(false)">False</button>
                    </div>
                </div>

                <!-- Back of Card: The Medical Science -->
                <div class="card-back">
                    <h2 id="result-title">Result</h2>
                    <p id="med-explanation">Explanation goes here...</p>
                    <button class="btn btn-next" onclick="nextQuestion()" id="next-btn">Next Question</button>
                </div>

            </div>
        </div>

        <div id="final-score-container" class="hidden">
            <h2>Quiz Complete! 🎉</h2>
            <p id="final-score-text"></p>
            <button class="btn" onclick="restartQuiz()">Try Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
